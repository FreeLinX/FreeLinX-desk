Section "Files"
    ModulePath      "/usr/share/X11/xtree/lib/xorg/modules"
    ModulePath      "/usr/lib/xorg/modules"
    FontPath        "/usr/share/fonts/TTF"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Module"
EndSection

Section "InputDevice"
    Identifier  "Keyboard"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-kbd"
    Option      "XkbRules" "xorg"
    Option      "XkbModel" "pc105"
    Option      "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier  "Mouse"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-pointer"
    Option      "AccelerationProfile" "0"
EndSection

Section "InputDevice"
    Identifier  "Mouse2"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-pointer2"
    Option      "AccelerationProfile" "0"
EndSection

# Standard VGA / fbdev: QEMU -vga std creates /dev/fb0 (fbdev driver).
# modesetting_drv.so is glibc+udev linked; incompatible with musl FreeLinX.
Section "Device"
    Identifier  "FLXFB"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "FLXFB"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "simple"
    Screen      "Screen0"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse"    "CorePointer"
EndSection