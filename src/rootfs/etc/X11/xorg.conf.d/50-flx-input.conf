# FreeLinX input defaults (libinput driver; devices are hot-plugged).

Section "InputClass"
    Identifier "flx keyboard"
    MatchIsKeyboard "on"
    Option "XkbRules" "evdev"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "us"
EndSection

Section "InputClass"
    Identifier "flx touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "false"
    Option "ScrollMethod" "twofinger"
    Option "DisableWhileTyping" "on"
    Option "ClickMethod" "clickfinger"
EndSection
