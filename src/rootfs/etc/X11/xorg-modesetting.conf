Section "Files"
    ModulePath      "/usr/share/X11/xtree/lib/xorg/modules"
    ModulePath      "/usr/lib/xorg/modules"
    FontPath        "/usr/share/fonts/TTF"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Module"
    Load "glamoregl"
EndSection

Section "InputDevice"
    Identifier  "Keyboard"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-kbd"
    Option      "XkbRules" "xorg"
    Option      "XkbModel" "pc105"
    Option      "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier  "Mouse"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-pointer"
    Option      "AccelerationProfile" "0"
EndSection

Section "InputDevice"
    Identifier  "Mouse2"
    Driver      "evdev"
    Option      "Device"   "/dev/fl-pointer2"
    Option      "AccelerationProfile" "0"
EndSection

# Standard VGA / fbdev: QEMU -vga std creates /dev/fb0 (fbdev driver).
# GPU with a kernel modesetting driver (i915, amdgpu, radeon, nouveau,
# virtio-gpu): KMS + glamor acceleration through Mesa. Selected by
# flx-session; if glamor cannot start, modesetting falls back to a shadow
# framebuffer on its own.
Section "Device"
    Identifier  "FLXFB"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"
    Option      "AccelMethod" "glamor"
    Option      "PageFlip" "on"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "FLXFB"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "simple"
    Screen      "Screen0"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse"    "CorePointer"
    InputDevice "Mouse2"   "SendCoreEvents"
EndSection