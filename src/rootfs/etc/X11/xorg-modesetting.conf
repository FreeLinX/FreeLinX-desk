Section "Files"
    ModulePath      "/usr/share/X11/xtree/lib/xorg/modules"
    ModulePath      "/usr/lib/xorg/modules"
    FontPath        "/usr/share/fonts/TTF"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInitialConfiguration" "true"
    # Input devices are found and hot-plugged through the udev backend
    # (libudev-zero + mdevd -O 4) and driven by libinput: see
    # /etc/X11/xorg.conf.d/50-flx-input.conf.
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Module"
    Load "glamoregl"
EndSection

# Standard VGA / fbdev: QEMU -vga std creates /dev/fb0 (fbdev driver).
# GPU with a hardware Mesa driver (Intel i915 -> iris/crocus/i915,
# NVIDIA nouveau): KMS + glamor acceleration. Selected by flx-session.
Section "Device"
    Identifier  "FLXFB"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"
    Option      "AccelMethod" "glamor"
    Option      "PageFlip" "on"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "FLXFB"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "simple"
    Screen      "Screen0"
EndSection