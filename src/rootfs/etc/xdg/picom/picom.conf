# FreeLinX Desktop - picom compositor configuration.
# Animasiya TAMAMILƏ deaktivdir (ZERO animation).
# Backend: GLX (VSync, screen tearing qarşısı).

# ── Backend ────────────────────────────────────────────────────────────────
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;

# ── Shadows ────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.4;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
    "class_g = 'slstatus'",
    "class_g = 'tint2'",
    "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DOCK'",
    "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DESKTOP'"
];

# ── Opacity ────────────────────────────────────────────────────────────────
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'geany'",
    "100:class_g = 'xfe'"
];

# ── Fading / Animation — TAMAMILƏ DEAKTIV ─────────────────────────────────
fading = false;
no-fading-openclose = true;
no-fading-destroyed-argb = true;

# ── Blur ───────────────────────────────────────────────────────────────────
blur-background = false;

# ── Rounded corners ────────────────────────────────────────────────────────
corner-radius = 0;

# ── Misc ───────────────────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";
