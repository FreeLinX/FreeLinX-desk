# FreeLinX/ports - system/dbus-1.16.2 : meson cross file (FreeLinX musl toolchain).
[binaries]
c = ['@DIRNAME@/../../../../toolchain/bin/clang', '--target=x86_64-linux-musl', '--sysroot=@DIRNAME@/../../../../toolchain/x86_64-linux-musl']
ar = '@DIRNAME@/../../../../toolchain/bin/llvm-ar'
ranlib = '@DIRNAME@/../../../../toolchain/bin/llvm-ranlib'
strip = '@DIRNAME@/../../../../toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-D_GNU_SOURCE', '-Wno-macro-redefined', '-include', 'string.h']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'