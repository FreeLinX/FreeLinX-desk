# FreeLinX/ports - graphics/weston : meson native (host) file.
# wayland-scanner must run on the build host; built natively into host-wl.
[binaries]
wayland-scanner = '@DIRNAME@/../../../ports/build/host-wl/bin/wayland-scanner'
pkg-config = '/usr/bin/pkg-config'

[properties]

[built-in options]
c_args = [, '-include', 'string.h']
c_link_args = ['-static', '-fuse-ld=lld', '--rtlib=compiler-rt']