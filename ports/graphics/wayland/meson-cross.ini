# FreeLinX/ports - graphics/wayland : meson cross file for the FreeLinX
# clang + LLD + musl toolchain.
[binaries]
c = ['/home/devuan/FreeLinX/toolchain/bin/clang', '--target=x86_64-linux-musl', '--sysroot=/home/devuan/FreeLinX/toolchain/x86_64-linux-musl']
cpp = ['/home/devuan/FreeLinX/toolchain/bin/clang++', '--target=x86_64-linux-musl', '--sysroot=/home/devuan/FreeLinX/toolchain/x86_64-linux-musl']
ar      = '/home/devuan/FreeLinX/toolchain/bin/llvm-ar'
ranlib  = '/home/devuan/FreeLinX/toolchain/bin/llvm-ranlib'
strip   = '/home/devuan/FreeLinX/toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'
wayland-scanner = '/usr/bin/wayland-scanner'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-D_GNU_SOURCE', '-include', 'sys/sysmacros.h', '-include', 'string.h', '-I/home/devuan/FreeLinX/Desktop-test/ports/build/deps/libffi/include']
c_link_args = ['-static', '-fuse-ld=lld', '--rtlib=compiler-rt']
cpp_args = ['-O2', '-D_GNU_SOURCE', '-stdlib=libc++', '-include', 'string.h']
cpp_link_args = ['-static', '-fuse-ld=lld', '--rtlib=compiler-rt']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'