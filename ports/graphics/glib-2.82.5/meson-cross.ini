# FreeLinX/ports - graphics/glib-2.82.5 : meson cross file (FreeLinX musl toolchain).
[binaries]
c = ['/home/devuan/FreeLinX/toolchain/bin/clang', '--target=x86_64-linux-musl', '--sysroot=/home/devuan/FreeLinX/toolchain/x86_64-linux-musl']
ar      = '/home/devuan/FreeLinX/toolchain/bin/llvm-ar'
ranlib  = '/home/devuan/FreeLinX/toolchain/bin/llvm-ranlib'
strip   = '/home/devuan/FreeLinX/toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'
glib-genmarshal = '/usr/bin/glib-genmarshal'
glib-mkenums = '/usr/bin/glib-mkenums'
glib-compile-schemas = '/usr/bin/glib-compile-schemas'
[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-D_GNU_SOURCE', '-Wno-macro-redefined', '-include', 'string.h']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
