# FreeLinX/ports - graphics/gtk-3.24.52 : meson cross file (FreeLinX musl toolchain).
[binaries]
c = ['@DIRNAME@/../../../../toolchain/bin/clang', '--target=x86_64-linux-musl', '--sysroot=@DIRNAME@/../../../../toolchain/x86_64-linux-musl']
cpp = ['@DIRNAME@/../../../../toolchain/bin/clang++', '--target=x86_64-linux-musl', '--sysroot=@DIRNAME@/../../../../toolchain/x86_64-linux-musl']
ar      = '@DIRNAME@/../../../../toolchain/bin/llvm-ar'
ranlib  = '@DIRNAME@/../../../../toolchain/bin/llvm-ranlib'
strip   = '@DIRNAME@/../../../../toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-D_GNU_SOURCE', '-Wno-macro-redefined', '-isystem@DIRNAME@/../../../ports/build/deps/gl-headers/include', '-include', 'string.h']
c_link_args = ['-fuse-ld=lld', '--rtlib=compiler-rt']
cpp_link_args = ['-fuse-ld=lld', '--rtlib=compiler-rt']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
