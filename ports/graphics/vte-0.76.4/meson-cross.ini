# FreeLinX/ports - graphics/vte-0.76.4 : meson cross file (FreeLinX musl toolchain).
[binaries]
c = ['@DIRNAME@/../../../../toolchain/bin/clang', '--target=x86_64-linux-musl', '--sysroot=@DIRNAME@/../../../../toolchain/x86_64-linux-musl']
cpp = ['@DIRNAME@/../../../../toolchain/bin/clang++', '--target=x86_64-linux-musl', '--sysroot=@DIRNAME@/../../../../toolchain/x86_64-linux-musl']
ar      = '@DIRNAME@/../../../../toolchain/bin/llvm-ar'
ranlib  = '@DIRNAME@/../../../../toolchain/bin/llvm-ranlib'
strip   = '@DIRNAME@/../../../../toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-D_GNU_SOURCE', '-Wno-macro-redefined', '-isystem@DIRNAME@/../../../ports/build/deps/gl-headers/include', '-isystem@DIRNAME@/../../../ports/build/deps/cairo-1.18.4/include', '-include', 'string.h']
cpp_args = ['-O2', '-Wno-macro-redefined', '-DW_EXITCODE(x,s)=((x)*256+(s))', '-isystem@DIRNAME@/../../../ports/build/deps/gl-headers/include', '-isystem@DIRNAME@/../../../ports/build/deps/cairo-1.18.4/include', '-include', 'string.h']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'